  <script>
    /* ── Particle Network Background ── */
    (function () {
      const CONFIG = {
        particleCount: 70,
        maxSpeed: 0.28,
        linkDistance: 140,
        particleColor: '30, 58, 95',
        lineColor: '30, 58, 95',
        particleOpacity: 0.25,
        lineMaxOpacity: 0.10,
        particleRadius: 2,
        mouseLinkDistance: 160,
        mouseRepel: true
      };

      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let width, height, particles = [];
      let mouse = { x: null, y: null };

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * CONFIG.maxSpeed * 2;
          this.vy = (Math.random() - 0.5) * CONFIG.maxSpeed * 2;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
          if (CONFIG.mouseRepel && mouse.x !== null) {
            const dx = this.x - mouse.x, dy = this.y - mouse.y;
            const dist = Math.hypot(dx, dy);
            if (dist < CONFIG.mouseLinkDistance && dist > 0) {
              const force = (CONFIG.mouseLinkDistance - dist) / CONFIG.mouseLinkDistance;
              this.x += (dx / dist) * force * 1.2;
              this.y += (dy / dist) * force * 1.2;
            }
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, CONFIG.particleRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${CONFIG.particleColor}, ${CONFIG.particleOpacity})`;
          ctx.fill();
        }
      }

      function init() {
        particles = [];
        for (let i = 0; i < CONFIG.particleCount; i++) particles.push(new Particle());
      }

      function linkParticles() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.hypot(dx, dy);
            if (dist < CONFIG.linkDistance) {
              const opacity = (1 - dist / CONFIG.linkDistance) * CONFIG.lineMaxOpacity;
              ctx.beginPath();
              ctx.strokeStyle = `rgba(${CONFIG.lineColor}, ${opacity})`;
              ctx.lineWidth = 0.8;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        linkParticles();
        requestAnimationFrame(animate);
      }

      init();
      animate();
    })();
  </script>
  <script>
    // Derive slug from path: /venue.html → "venue", / → "home"
    const rawPath = location.pathname.replace(/^\//, '').replace(/\.html$/, '');
    const qSlug = new URLSearchParams(location.search).get('slug');
    const slug = qSlug || rawPath || 'home';

    loadNav(slug);
    loadGlobalSettings();

    (async () => {
      try {
        const res = await fetch('/api/pages/' + slug);
        if (!res.ok) throw new Error('Not found');
        const page = await res.json();

        document.title = page.title + ' — AegisAI 2027';
        document.querySelector('meta[name="description"]').content = page.meta_description || '';
        document.querySelector('meta[property="og:title"]').content = page.title + ' — AegisAI 2027';
        document.querySelector('meta[property="og:description"]').content = page.meta_description || '';
        document.querySelector('meta[name="twitter:title"]').content = page.title + ' — AegisAI 2027';
        document.querySelector('meta[name="twitter:description"]').content = page.meta_description || '';



        // Special handling: contact page injects a form alongside contact_info
        if (slug === 'contact') {
          const contactInfo = page.sections.find(s => s.type === 'contact_info');
          document.getElementById('page-content').innerHTML = `
            <section class="section">
              <div class="container">
                <div class="contact-grid">
                  ${contactInfo ? renderSection(contactInfo) : ''}
                  <div class="contact-form-card">
                    <h3 style="font-size:1.1rem;font-weight:700;color:var(--primary);margin-bottom:1.25rem">Send a Message</h3>
                    <form id="contact-form">
                      <div class="form-group">
                        <label class="form-label" for="cf-name">Your Name</label>
                        <input class="form-input" id="cf-name" type="text" placeholder="" required>
                      </div>
                      <div class="form-group">
                        <label class="form-label" for="cf-email">Email Address</label>
                        <input class="form-input" id="cf-email" type="email" placeholder="" required>
                      </div>
                      <div class="form-group">
                        <label class="form-label" for="cf-msg">Message</label>
                        <textarea class="form-textarea" id="cf-msg" placeholder="" required></textarea>
                      </div>
                      <button class="btn btn-blue" type="submit" id="cf-submit" style="width:100%">Send Message</button>
                      <div class="form-msg" id="cf-response"></div>
                    </form>
                  </div>
                </div>
              </div>
            </section>`;

          document.getElementById('contact-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('cf-submit');
            const msg = document.getElementById('cf-response');
            btn.disabled = true; btn.textContent = 'Sending…';
            msg.className = 'form-msg';
            try {
              const r = await fetch('/api/contact', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name: document.getElementById('cf-name').value,
                  email: document.getElementById('cf-email').value,
                  message: document.getElementById('cf-msg').value
                })
              });
              const data = await r.json();
              if (r.ok) {
                msg.textContent = data.message; msg.className = 'form-msg success';
                e.target.reset();
              } else {
                msg.textContent = data.error || 'Something went wrong.'; msg.className = 'form-msg error';
              }
            } catch {
              msg.textContent = 'Network error. Please try again.'; msg.className = 'form-msg error';
            }
            btn.disabled = false; btn.textContent = 'Send Message';
          });

        } else {
          // Standard page: render all sections in order
          let html = '';
          for (const section of page.sections) html += renderSection(section);
          document.getElementById('page-content').innerHTML = html;
        }

        initFadeIn();
      } catch {
        document.getElementById('page-content').innerHTML =
          `<div class="section"><div class="container"><div class="text-block-card">
            <h2>Page Not Found</h2>
            <p>This page doesn't exist or hasn't been published yet.</p>
          </div></div></div>`;
      }
    })();
  </script>
