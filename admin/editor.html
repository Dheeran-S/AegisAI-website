<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AegisAI 2027 — Page Editor Admin.">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AegisAI 2027 — Editor">
  <meta property="og:description" content="AegisAI 2027 — Admin Page Editor. Shiv Nadar University Chennai.">
  <meta property="og:image" content="http://aegisai27.snuchennai.edu.in/images/aegislogo.png">
  <meta property="og:url" content="http://aegisai27.snuchennai.edu.in/admin/editor.html">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AegisAI 2027 — Editor">
  <meta name="twitter:image" content="http://aegisai27.snuchennai.edu.in/images/aegislogo.png">
  <title>Editor — AegisAI Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="sl-top">SHIV NADAR</span>
        <span class="sl-mid">UNIVERSITY</span>
        <span class="sl-bot">CHENNAI</span>
      </div>
      <div class="sidebar-subtitle">AegisAI 2027 · Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        All Pages
      </a>
      <a href="contacts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Contact Messages
      </a>
      <a href="#" onclick="openPhotoSidebar(); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Images</a>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-admin" id="admin-name">Admin</div>
      <button class="btn-a btn-ghost-a btn-sm" onclick="localStorage.clear();location.href='login.html'">Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="topbar">
      <div>
        <a id="back-link" href="dashboard.html" style="font-size:.8rem;color:var(--muted);text-decoration:none">← Back to Pages</a>
        <h1 id="page-title" style="margin-top:.25rem">Loading…</h1>
      </div>
    </div>
    <div id="sections-container"></div>
  </main>
</div>

<!-- Cropper Modal -->
<div id="cropper-modal" class="cropper-modal-overlay">
  <div class="cropper-modal-content">
    <h3>Crop Image</h3>
    <div class="cropper-container-wrapper">
      <img id="cropper-image" src="" alt="To crop" style="max-width:100%; display:block;">
    </div>
    <div class="cropper-actions">
      <button class="btn-a btn-ghost-a" onclick="closeCropper()">Cancel</button>
      <button class="btn-a btn-primary-a" onclick="applyCrop()" id="btn-crop-upload">Crop & Upload</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script src="js/editor.js"></script>
<script src="js/shared.js"></script>
</body>
</html>
