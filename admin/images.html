<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AegisAI 2027 — Image Manager Admin.">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AegisAI 2027 — Image Manager">
  <meta property="og:description" content="AegisAI 2027 — Admin Image Manager. Shiv Nadar University Chennai.">
  <meta property="og:image" content="http://aegisai27.snuchennai.edu.in/images/aegislogo.png">
  <meta property="og:url" content="http://aegisai27.snuchennai.edu.in/admin/images.html">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AegisAI 2027 — Image Manager">
  <meta name="twitter:image" content="http://aegisai27.snuchennai.edu.in/images/aegislogo.png">
  <title>Images — AegisAI Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .image-card {
      background: var(--bg-a);
      border: 1px solid var(--border-a);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .image-card-thumb {
      height: 150px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-card-thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .image-card-body {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .image-card-title {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-a);
    }
    .image-card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
    }
    .upload-box {
      border: 2px dashed var(--border-a);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      background: var(--bg-card-a);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-box:hover {
      border-color: var(--primary-a);
      background: rgba(37, 99, 235, 0.05);
    }
    .upload-box input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="sl-top">SHIV NADAR</span><span class="sl-mid">UNIVERSITY</span><span class="sl-bot">CHENNAI</span>
      </div>
      <div class="sidebar-subtitle">AegisAI 2027 · Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Pages</a>
      <a href="contacts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact Messages</a>
      <a href="images.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Images</a>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-admin" id="admin-name">Admin</div>
      <button class="btn-a btn-ghost-a btn-sm" onclick="localStorage.clear();location.href='login.html'">Sign Out</button>
    </div>
  </aside>
  <main class="admin-main">
    <div class="topbar">
      <h1>Image Gallery</h1>
      <button class="btn-a btn-ghost-a btn-sm" id="close-iframe-btn" style="display:none;" onclick="window.parent.closePhotoSidebar()">✕ Close</button>
    </div>
    
    <div id="upload-msg"></div>

    <div class="a-card" style="margin-bottom: 2rem;">
      <div class="upload-box" id="upload-box">
        <svg style="margin-bottom: 1rem; color: var(--primary-a)" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <h3 style="margin-bottom: 0.5rem">Upload Image</h3>
        <p style="color: var(--muted); font-size: 0.9rem">Click here to browse for an image (PNG, JPG, WebP)</p>
        <input type="file" id="file-input" accept="image/*">
      </div>
    </div>

    <div id="images-container" class="images-grid">
      <div style="color:var(--muted)">Loading gallery...</div>
    </div>
  </main>
</div>

<script>
const token = localStorage.getItem('aegis_token');
if (!token) location.href = 'login.html';
document.getElementById('admin-name').textContent = localStorage.getItem('aegis_name') || 'Admin';

const uploadBox = document.getElementById('upload-box');
const fileInput = document.getElementById('file-input');
const imagesContainer = document.getElementById('images-container');
const msgBox = document.getElementById('upload-msg');

uploadBox.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('image', file);

  uploadBox.style.opacity = '0.5';
  uploadBox.style.pointerEvents = 'none';
  msgBox.innerHTML = '<div class="alert alert-success">Uploading...</div>';

  try {
    const res = await fetch('/api/images', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData
    });
    
    const data = await res.json();
    if (res.ok) {
      msgBox.innerHTML = '<div class="alert alert-success">Image uploaded successfully!</div>';
      loadImages();
    } else {
      msgBox.innerHTML = `<div class="alert alert-error">${data.error || 'Upload failed'}</div>`;
    }
  } catch (err) {
    msgBox.innerHTML = `<div class="alert alert-error">Network error</div>`;
  }
  
  uploadBox.style.opacity = '1';
  uploadBox.style.pointerEvents = 'auto';
  fileInput.value = '';
  setTimeout(() => msgBox.innerHTML = '', 3000);
});

async function loadImages() {
  try {
    const res = await fetch('/api/images', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const images = await res.json();
    
    if (images.length === 0) {
      imagesContainer.innerHTML = '<div style="color:var(--muted); grid-column: 1 / -1; text-align: center; padding: 2rem;">No images uploaded yet.</div>';
      return;
    }
    
    imagesContainer.innerHTML = images.map(img => `
      <div class="image-card">
        <div class="image-card-thumb">
          <img src="${img.url}" alt="${img.filename}" loading="lazy">
        </div>
        <div class="image-card-body">
          <div class="image-card-title" title="${img.filename}">${img.filename}</div>
          <div class="image-card-actions">
            <button class="btn-a btn-primary-a btn-sm" style="flex:1" onclick="copyUrl('${img.url}')">Copy URL</button>
            <button class="btn-a btn-danger-a btn-sm" onclick="deleteImage('${img.filename}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    imagesContainer.innerHTML = '<div style="color:var(--error)">Failed to load images.</div>';
  }
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    msgBox.innerHTML = '<div class="alert alert-success">URL copied to clipboard!</div>';
    setTimeout(() => msgBox.innerHTML = '', 2000);
  });
}

async function deleteImage(filename) {
  if (!confirm(`Are you sure you want to delete ${filename}? This will break any pages using this image.`)) return;
  
  try {
    const res = await fetch(`/api/images/${filename}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.ok) {
      loadImages();
    } else {
      const data = await res.json();
      alert('Error: ' + data.error);
    }
  } catch (err) {
    alert('Network error');
  }
}

loadImages();

if (window.self !== window.top) {
  document.querySelector('.sidebar').style.display = 'none';
  document.querySelector('.admin-main').style.marginLeft = '0';
  const closeBtn = document.getElementById('close-iframe-btn');
  if (closeBtn) closeBtn.style.display = 'inline-block';
}
</script>
</body>
</html>
