<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="sl-top">SHIV NADAR</span><span class="sl-mid">UNIVERSITY</span><span class="sl-bot">CHENNAI</span>
      </div>
      <div class="sidebar-subtitle">AegisAI 2027 · Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Pages</a>
      <a href="contacts.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact Messages</a>
      <a href="#" onclick="openPhotoSidebar(); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Images</a>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-admin" id="admin-name">Admin</div>
      <button class="btn-a btn-ghost-a btn-sm" onclick="localStorage.clear();location.href='login.html'">Sign Out</button>
    </div>
  </aside>
  <main class="admin-main">
    <div class="topbar"><h1>Contact Messages</h1></div>
    <div class="a-card">
      <table class="contacts-table" id="contacts-table">
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Message</th><th></th></tr></thead>
        <tbody id="contacts-body"><tr><td colspan="5" style="color:var(--muted);font-size:.85rem">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script>
const token = localStorage.getItem('aegis_token');
if (!token) location.href = 'login.html';
document.getElementById('admin-name').textContent = localStorage.getItem('aegis_name') || 'Admin';
async function load() {
  const r = await fetch('/api/contact', { headers: { Authorization: 'Bearer ' + token } });
  const rows = await r.json();
  const tbody = document.getElementById('contacts-body');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">No messages yet.</td></tr>'; return; }
  tbody.innerHTML = rows.map(c => `<tr>
    <td style="white-space:nowrap;font-size:.78rem;color:var(--muted)">${new Date(c.created_at).toLocaleDateString()}</td>
    <td style="font-weight:600">${c.name} ${c.is_read ? '' : '<span class="badge-unread">New</span>'}</td>
    <td><a href="mailto:${c.email}" style="color:var(--primary)">${c.email}</a></td>
    <td style="max-width:320px">${c.message}</td>
    <td>${!c.is_read ? `<button class="btn-a btn-ghost-a btn-sm" onclick="markRead(${c.id},this)">Mark Read</button>` : ''}</td>
  </tr>`).join('');
}
async function markRead(id, btn) {
  await fetch('/api/contact/'+id+'/read', { method:'PATCH', headers:{Authorization:'Bearer '+token} });
  btn.closest('tr').querySelector('.badge-unread')?.remove();
  btn.remove();
}
load();
</script>
<script src="js/shared.js"></script>
</body>
</html>
